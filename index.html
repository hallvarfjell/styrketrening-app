
<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Styrketreningsapp</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  
<!-- Ikon-sprite (inline) -->
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;visibility:hidden" aria-hidden="true">
  <!-- Hamburger -->
  <symbol id="icon-hamburger" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M4 6h16M4 12h16M4 18h16"/>
  </symbol>
  <!-- Play -->
  <symbol id="icon-play" viewBox="0 0 24 24" fill="currentColor">
    <path d="M8 5v14l11-7z"/>
  </symbol>
  <!-- Pause -->
  <symbol id="icon-pause" viewBox="0 0 24 24" fill="currentColor">
    <path d="M6 5h4v14H6zM14 5h4v14h-4z"/>
  </symbol>
  <!-- Next (dobbel pil) -->
  <symbol id="icon-next" viewBox="0 0 24 24" fill="currentColor">
    <path d="M5 5l7 7-7 7V5zm7 0l7 7-7 7V5z"/>
  </symbol>
  <!-- Prev (dobbel pil venstre) -->
  <symbol id="icon-prev" viewBox="0 0 24 24" fill="currentColor">
    <path d="M19 5l-7 7 7 7V5zm-7 0L5 12l7 7V5z"/>
  </symbol>
  <!-- Save (diskett) -->
  <symbol id="icon-save" viewBox="0 0 24 24" fill="currentColor">
    <path d="M17 3H5a2 2 0 0 0-2 2v14l4-4h10a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zM7 7h8v4H7z"/>
  </symbol>
  <!-- Trash -->
  <symbol id="icon-trash" viewBox="0 0 24 24" fill="currentColor">
    <path d="M9 3h6l1 2h5v2H3V5h5l1-2zm1 6h2v9h-2V9zm4 0h2v9h-2V9z"/>
  </symbol>
  <!-- Pencil -->
  <symbol id="icon-pencil" viewBox="0 0 24 24" fill="currentColor">
    <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
  </symbol>
  <!-- Star (outline) -->
  <symbol id="icon-star-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <path d="M12 17.27l6.18 3.73-1.64-7.03L21 9.24l-7.19-.61L12 2 10.19 8.63 3 9.24l4.46 4.73L5.82 21z"/>
  </symbol>
  <!-- Star (filled) -->
  <symbol id="icon-star-filled" viewBox="0 0 24 24" fill="#FFD54F" stroke="black" stroke-width="1.1">
    <path d="M12 17.27l6.18 3.73-1.64-7.03L21 9.24l-7.19-.61L12 2 10.19 8.63 3 9.24l4.46 4.73L5.82 21z"/>
  </symbol>
  <!-- Plus -->
  <symbol id="icon-plus" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M12 5v14M5 12h14"/>
  </symbol>
</svg>

  <!-- Toppfelt: logo, modulknapper og responsiv hamburgermeny -->
  <header class="topbar">
    <div class="brand">
      <img src="assets/logo.png" alt="Logo" />
      <span>Styrketrening</span>
    </div>

    <!-- Vanlige modulknapper (skjules på smal skjerm via CSS) -->
    <nav class="nav" id="mainNav">
      <button data-route="dashboard" class="nav-btn active">Dashboard</button>
      <button data-route="library" class="nav-btn">Øktvelger</button>
      <button data-route="editor" class="nav-btn">Editor</button>
      <button data-route="log" class="nav-btn">Logg</button>
    </nav>

    <!-- Hamburgermeny-knapp (vises når .nav skjules) -->
    <button id="hamburgerBtn" class="hamburger" aria-label="Meny">☰</button>

    <!-- Drop-down panel med modulvalg -->
    <div id="hamburgerMenu" class="hamburger-menu card" style="display:none;">
      <button data-route="dashboard" class="menu-item">Dashboard</button>
      <button data-route="library" class="menu-item">Øktvelger</button>
      <button data-route="editor" class="menu-item">Editor</button>
      <button data-route="log" class="menu-item">Logg</button>
    </div>
  </header>

  <main id="app" class="container"></main>
  <footer class="footer">© 2026</footer>

  <script src="app.js"></script>
  <script src="modules/dashboard.js"></script>
  <script src="modules/library.js"></script>
  <script src="modules/editor.js"></script>
  <script src="modules/session.js"></script>
  <script src="modules/log.js"></script>
</body>
</html>
``
